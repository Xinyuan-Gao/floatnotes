<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>悬浮笔记编辑器</title>
    <style>
      :root {
        color-scheme: light dark;
        --fn-font-size: 16px;
        --fn-font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      }
      /* ★ 滚动容器必须是 .bn-container，不能让它逃到 html 上。
         之前 body 设了 overflow:hidden 而 .bn-container 是 overflow:visible，
         溢出全跑到 html —— 结果是「程序化 scrollTop 能滚，真实滚轮滚不动」。
         实测发真实 scrollWheel 事件，滚动前后 scrollTop 都是 0。 */
      html, body, #root {
        height: 100%; margin: 0; padding: 0;
        overflow: hidden;
      }
      body { background: transparent; }

      /* ── 笔记背景 ────────────────────────────────────────
         图片铺满窗口，上面压一层很淡的护罩保证正文对比度。
         护罩不能太重，否则背景就看不出花样了。 */
      body.fn-has-bg {
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
      }
      body.fn-has-bg::before {
        content: "";
        position: fixed;
        inset: 0;
        background: rgba(255, 255, 255, 0.25);
        pointer-events: none;
        z-index: 0;
      }
      /* 深色底用深护罩，否则黑字压深蓝完全看不清 */
      body.fn-has-bg.fn-bg-dark::before {
        background: rgba(0, 0, 0, 0.30);
      }
      body.fn-has-bg #root { position: relative; z-index: 1; }

      /* 编辑器自己的底色要透掉，不然背景被盖住 */
      body.fn-has-bg .bn-container,
      body.fn-has-bg .bn-editor,
      body.fn-has-bg .bn-block-outer {
        background-color: transparent !important;
      }

      /* 收紧内边距，更适合小窗；同时由它承担滚动 */
      .bn-container {
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
      }

      /* ★ 必须覆盖 BlockNote 自己的 .bn-default-styles ——
         它把 font-family 和 font-size 都写死在那里，
         只改 .bn-editor 会被它盖掉（字体和字号都失效）。 */
      .bn-default-styles,
      .bn-editor {
        font-family: var(--fn-font-family) !important;
        font-size: var(--fn-font-size) !important;
      }

      /* 代码保持等宽，不受正文字体影响 */
      .bn-inline-content code,
      .bn-block-content[data-content-type="codeBlock"] {
        font-family: Menlo, "PingFang SC", monospace !important;
      }

      .bn-editor {
        padding-inline: 22px !important;
        padding-bottom: 48px !important;
      }

      /* 让图片自适应窗口宽度 */
      .bn-visual-media,
      .bn-block-content[data-content-type="image"] img {
        max-width: 100%;
        height: auto;
        border-radius: 6px;
      }

      /* 表格窄窗下可横向滚动，不撑破布局 */
      .bn-block-content[data-content-type="table"] {
        overflow-x: auto;
      }

      /* 滚动条收细 */
      ::-webkit-scrollbar { width: 9px; height: 9px; }
      ::-webkit-scrollbar-thumb {
        background: rgba(128, 128, 128, 0.35);
        border-radius: 5px;
      }
      ::-webkit-scrollbar-thumb:hover { background: rgba(128, 128, 128, 0.55); }
      ::-webkit-scrollbar-track { background: transparent; }

      /* ── 格式工具栏 ──────────────────────────────────────
         选中文字时浮在选区上方。BlockNote 自带的那个实测不出现，
         所以自己画一个：块类型、字色、高亮、代码语言都在这里。 */
      .fn-toolbar {
        position: fixed;
        transform: translate(-50%, calc(-100% - 8px));
        z-index: 50;
        padding: 6px 8px;
        border-radius: 9px;
        background: rgba(38, 38, 42, 0.96);
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.30);
        display: flex;
        flex-direction: column;
        gap: 4px;
        /* 工具栏可能贴着窗口上沿，别让它顶出可视区 */
        max-width: calc(100vw - 16px);
        flex-wrap: wrap;
      }
      /* 选区太靠上时改成挂在选区下方，否则工具栏会顶出窗口 */
      .fn-toolbar.below { transform: translate(-50%, 8px); }
      .fn-tb-row { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; }
      .fn-tb-btn {
        min-width: 22px; height: 22px; padding: 0 5px;
        border: 0; border-radius: 5px;
        background: rgba(255, 255, 255, 0.10);
        color: #f2f2f5;
        font-size: 11px; font-weight: 600; line-height: 1;
        cursor: pointer;
      }
      .fn-tb-btn:hover { background: rgba(255, 255, 255, 0.24); }
      .fn-tb-wide { font-weight: 500; }
      .fn-tb-label {
        color: rgba(255, 255, 255, 0.60);
        font-size: 10px; margin: 0 2px 0 4px;
        font-family: var(--fn-font-family);
      }
      .fn-tb-swatch {
        width: 16px; height: 16px; padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.30);
        border-radius: 50%;
        cursor: pointer;
      }
      .fn-tb-swatch:hover { border-color: #fff; transform: scale(1.15); }
      .fn-tb-sep {
        width: 1px; height: 14px; margin: 0 3px;
        background: rgba(255, 255, 255, 0.20);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
